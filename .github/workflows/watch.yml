name: TAIEX dip watch

on:
  schedule:
    # Backup only: GitHub's scheduler can run hours late or skip days.
    # The primary trigger is cron-job.org calling workflow_dispatch at 08:50 Taipei.
    - cron: "50 0 * * 1-5" # 08:50 Taipei, Mon-Fri
  workflow_dispatch:
    inputs:
      once:
        description: "Single check now (ignores market hours)"
        type: boolean
        default: true
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: false
      threshold:
        description: "Alert threshold in % (use 0 to force a test email)"
        type: string
        default: "-3.0"

concurrency:
  group: taiex-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - run: python3 taiex_alert.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ONCE: ${{ inputs.once && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          THRESHOLD: ${{ inputs.threshold || '-3.0' }}
